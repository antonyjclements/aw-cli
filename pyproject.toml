[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aw-cli"
version = "0.1.0"
description = "Python CLI for Augmented Workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "textual>=0.86",
  "textual-plot>=0.10.1",
]

[project.urls]
Homepage = "https://github.com/antonyjclements/aw-cli"
Repository = "https://github.com/antonyjclements/aw-cli"
Issues = "https://github.com/antonyjclements/aw-cli/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
aw = "aw_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
